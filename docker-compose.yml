services:
  postgres:
    image: postgres:16-alpine
    container_name: nextround-postgres
    environment:
      POSTGRES_USER: nextround
      POSTGRES_PASSWORD: nextround
      POSTGRES_DB: nextround
    ports:
      - "5433:5432"
    volumes:
      - nextround-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextround -d nextround"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  nextround-pgdata:
